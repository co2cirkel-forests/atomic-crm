<!doctype html>
<html lang="en" translate="no" class="notranslate">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="google" content="notranslate" />
        <link rel="shortcut icon" href="./favicon.ico" />
        <title>Atomic CRM</title>
        <style>
            body {
                margin: 0;
                padding: 24px;
                min-height: 100vh;
                box-sizing: border-box;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: sans-serif;
                background-color: #fafafa;
                color: #1a1a1a;
            }

            main {
                width: 100%;
                max-width: 420px;
                padding: 32px;
                box-sizing: border-box;
                background: #ffffff;
                border: 1px solid #e2e2e2;
                border-radius: 8px;
            }

            h1 {
                margin: 0 0 12px;
                font-size: 22px;
                line-height: 1.3;
            }

            p {
                margin: 0 0 24px;
                line-height: 1.5;
            }

            button {
                width: 100%;
                padding: 12px 16px;
                font-size: 16px;
                font-family: inherit;
                color: #ffffff;
                background: #283593;
                border: 0;
                border-radius: 6px;
                cursor: pointer;
            }

            button:focus-visible {
                outline: 3px solid #8c9eff;
                outline-offset: 2px;
            }

            button:disabled {
                opacity: 0.6;
                cursor: default;
            }

            .error {
                color: #b00020;
            }
        </style>
    </head>

    <body>
        <noscript> You need to enable JavaScript to run this app. </noscript>
        <main>
            <h1 id="title">Atomic CRM</h1>
            <p id="message">Checking your link…</p>
            <button id="continue" type="button" hidden></button>
        </main>
        <script>
            // Both values are public: the same ones the CRM already uses.
            // The key is the VITE_SB_PUBLISHABLE_KEY value in .env.production.local.
            const SUPABASE_URL = 'https://sfkggmuvvnsskowqkaqq.supabase.co';
            const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_mvZZ1CdKEKSOwvP-7f075w_d_C534ea';

            const titleEl = document.getElementById('title');
            const messageEl = document.getElementById('message');
            const buttonEl = document.getElementById('continue');

            const LABELS = {
                invite: {
                    title: 'You’re invited to Atomic CRM',
                    message: 'Select the button to accept your invitation.',
                    button: 'Accept invitation',
                },
                recovery: {
                    title: 'Reset your password',
                    message: 'Select the button to choose a new password.',
                    button: 'Choose a new password',
                },
                signup: {
                    title: 'Confirm your email address',
                    message: 'Select the button to confirm your email address.',
                    button: 'Confirm email address',
                },
            };

            function showError(text) {
                titleEl.textContent = 'This link can’t be used';
                messageEl.textContent = text;
                messageEl.className = 'error';
                buttonEl.hidden = true;
            }

            function goToApp(access_token, refresh_token, type) {
                window.location.replace(
                    './#/auth-callback' +
                        '?access_token=' + encodeURIComponent(access_token) +
                        '&refresh_token=' + encodeURIComponent(refresh_token) +
                        '&type=' + encodeURIComponent(type)
                );
            }

            function start() {
                // Old-style links (tokens in the URL hash) keep working as before.
                const hashParams = new URLSearchParams(
                    window.location.hash.substring(1)
                );
                if (hashParams.get('access_token')) {
                    goToApp(
                        hashParams.get('access_token'),
                        hashParams.get('refresh_token'),
                        hashParams.get('type')
                    );
                    return;
                }

                // New-style links: ?token_hash=...&type=...
                // Nothing is verified until the person selects the button.
                const queryParams = new URLSearchParams(window.location.search);
                const tokenHash = queryParams.get('token_hash');
                const type = queryParams.get('type');

                if (!tokenHash || !LABELS[type]) {
                    showError(
                        'The link is incomplete. Ask for a new invitation or request a new password reset.'
                    );
                    return;
                }

                if (SUPABASE_PUBLISHABLE_KEY.indexOf('PASTE_') === 0) {
                    showError(
                        'This page isn’t finished being set up: the publishable key is missing.'
                    );
                    return;
                }

                titleEl.textContent = LABELS[type].title;
                messageEl.textContent = LABELS[type].message;
                buttonEl.textContent = LABELS[type].button;
                buttonEl.hidden = false;

                buttonEl.addEventListener('click', async () => {
                    buttonEl.disabled = true;
                    messageEl.textContent = 'Checking your link…';
                    try {
                        const response = await fetch(
                            SUPABASE_URL + '/auth/v1/verify',
                            {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    apikey: SUPABASE_PUBLISHABLE_KEY,
                                },
                                body: JSON.stringify({
                                    type: type,
                                    token_hash: tokenHash,
                                }),
                            }
                        );
                        const data = await response.json();
                        if (!response.ok || !data.access_token) {
                            throw new Error('Verification failed');
                        }
                        goToApp(data.access_token, data.refresh_token, type);
                    } catch (error) {
                        showError(
                            'This link is invalid or has expired. Ask for a new invitation or request a new password reset.'
                        );
                    }
                });
            }

            start();
        </script>
    </body>
</html>
